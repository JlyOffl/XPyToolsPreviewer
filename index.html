<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Listen · XPyTools</title>
<style>
  :root{--bg:#f4f7fa;--card:#fff;--text:#183049;--muted:#5b6b7b;--line:#d9e3eb;--accent:#1d9bf0;--on-accent:#fff;--ok:#1a7f37;--warn:#9a6700}
  @media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2026;--text:#e8edf2;--muted:#9aa7b4;--line:#2c343d;--accent:#3aa6f2;--on-accent:#06121c;--ok:#4cc26a;--warn:#e3b341}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
  /* A compact card: about half the screen, centered. */
  main{width:clamp(280px,50vw,420px);min-height:50vh;min-height:50dvh;max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:safe center}
  main>*{flex:none;max-width:100%}
  .art{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--line);margin:0 auto 8px;display:block;flex:none}
  .live{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;color:#d93636;margin-bottom:2px}
  h1{font-size:17px;line-height:1.3;margin:0 0 2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .host{color:var(--muted);font-size:14px;margin:0 0 12px;overflow-wrap:anywhere}
  .play{width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:24px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .play:disabled{opacity:.5;cursor:default}
  .status{min-height:20px;margin:8px 0 10px;color:var(--muted);font-size:13px}
  .status.ok{color:var(--ok)}.status.warn{color:var(--warn)}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
  .tip{margin:10px 0 0;font-size:12px;line-height:1.35;color:var(--muted)}
  audio{display:none}
</style>
</head>
<body>
<main>
  <img class="art" id="art" alt="" hidden>
  <div class="live">● LIVE SPACE</div>
  <h1 id="title">X Space</h1>
  <p class="host" id="host"></p>
  <button class="play" id="play" aria-label="Play">▶</button>
  <div class="status" id="status" role="status">Tap play to listen.</div>
  <div class="row">
    <button class="btn" id="copy" type="button">Copy stream link</button>
    <a class="btn" id="open" href="#" target="_blank" rel="noopener" hidden>Open in X</a>
  </div>
  <p class="tip">Open in Safari to keep listening in the background. Closing Discord's in-app browser stops it.</p>
  <audio id="audio" preload="none" playsinline></audio>
</main>
<script>
(()=>{
  const q=new URLSearchParams(location.search);
  const https=v=>{try{const u=new URL(v);return u.protocol==='https:'?u.href:'';}catch{return '';}};
  const stream=https(q.get('s')||''),art=https(q.get('a')||'');
  const title=(q.get('t')||'X Space').slice(0,200),host=(q.get('h')||'').slice(0,100),id=(q.get('id')||'').replace(/[^A-Za-z0-9]/g,'');
  const $=x=>document.getElementById(x),audio=$('audio'),play=$('play'),status=$('status');
  const say=(text,kind='')=>{status.textContent=text;status.className='status'+(kind?' '+kind:'');};
  $('title').textContent=title;document.title=title+' · Listen';
  if(host) $('host').textContent='Hosted by '+host;
  if(art){$('art').onerror=()=>{$('art').hidden=true;};$('art').src=art;$('art').hidden=false;}
  if(id){$('open').href='https://x.com/i/spaces/'+id;$('open').hidden=false;}
  if(!stream){play.disabled=true;$('copy').disabled=true;say('This link has no stream address.','warn');return;}

  // Lock screen / Control Center: title, host and picture, with play and pause.
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title,artist:host||'X Space',album:'X Spaces',artwork:art?[{src:art,sizes:'400x400',type:'image/jpeg'}]:[]});
    navigator.mediaSession.setActionHandler('play',()=>start());
    navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
    navigator.mediaSession.setActionHandler('stop',()=>audio.pause());
  }

  let ready=false,hls=null;
  // Safari plays HLS natively; other browsers load hls.js on first play.
  function attach(){
    if(ready) return Promise.resolve();
    ready=true;
    if(audio.canPlayType('application/vnd.apple.mpegurl')){audio.src=stream;return Promise.resolve();}
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';
      s.onload=()=>{
        if(!window.Hls||!Hls.isSupported()){reject(new Error('unsupported'));return;}
        hls=new Hls({lowLatencyMode:true});
        hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal) say("Can't load the stream here. It may have ended, or try Copy stream link.",'warn');});
        hls.loadSource(stream);hls.attachMedia(audio);resolve();
      };
      s.onerror=()=>reject(new Error('player'));
      document.head.appendChild(s);
    });
  }
  async function start(){
    try{
      say('Connecting…');
      await attach();
      await audio.play();
    }catch{
      ready=false;
      say("Couldn't start playback. The Space may have ended, or try Copy stream link.",'warn');
    }
  }
  play.addEventListener('click',()=>audio.paused?start():audio.pause());
  audio.addEventListener('playing',()=>{play.textContent='❚❚';play.setAttribute('aria-label','Pause');say('Playing live','ok');if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing';});
  audio.addEventListener('pause',()=>{play.textContent='▶';play.setAttribute('aria-label','Play');say('Paused');if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused';});
  audio.addEventListener('waiting',()=>say('Buffering…'));
  audio.addEventListener('error',()=>{if(!hls) say('The stream stopped. The Space may have ended.','warn');});

  $('copy').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(stream);say('Stream link copied','ok');}
    catch{window.prompt('Copy the stream link:',stream);}
  });
})();
</script>
</body>
</html>
